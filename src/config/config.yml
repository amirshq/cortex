embedding_model_name: "text-embedding-ada-002"
max_tokens: 4096

llm_config: 
  llm_system_role: "You are a helpful assistant. Use the following context to answer the question."


llm_model_name: "gpt-3.5-turbo"
temperature: 0.7
max_token: 1500



directories:
  db_path: "data/chatbot.db"
  vectordb_dir: "data/vectordb"

llm_config:
  chat_model: "gpt-4o"
  summary_model: "gpt-3.5-turbo"
  rag_model: "gpt-4o-mini"
  temperature: 0.0

chat_history_config:
  max_history_pairs: 2
  max_characters: 1000
  max_tokens: 2000

agent_config:
  max_function_calls: 3

vectordb_config:
  collection_name: "chat_history"
  embedding_model: "text-embedding-3-small" 
  k: 3
# Non-secret application settings. Loaded by src/utils/config.py.
#
# Secrets and per-environment values — API keys, endpoints, and the provider
# switches (LLM_PROVIDER, EMBEDDING_PROVIDER, ...) — live in .env instead.
# Duplicate keys are rejected at load time (see utils/config.py).

directories:
  db_path: "data/chatbot.db"
  vectordb_dir: "data/vectordb"

# Every model the app uses — the ONE place to change them.
#
# Names are OpenAI model names. With LLM_PROVIDER / EMBEDDING_PROVIDER=azure_openai
# the Azure *deployment* names from .env are used instead
# (AZURE_OPENAI_CHAT_DEPLOYMENT_NAME / AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME),
# and with LLM_PROVIDER=huggingface the local model is HF_MODEL_NAME.
models:
  chat:                    # the agent behind POST /chat
    name: "gpt-4o"
  rag:                     # answers POST /rag/query from retrieved chunks
    name: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 512
  embedding:               # changing this requires re-indexing: vectors from
    name: "text-embedding-3-small"   # different models are not comparable
  reranker:                # cross-encoder that scores retrieved chunks
    name: "BAAI/bge-reranker-base"

prompts:
  rag_system_role: "You are a helpful assistant. Use the following context to answer the question."


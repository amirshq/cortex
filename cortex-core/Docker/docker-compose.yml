services:
  app:
    build:
      context: ..
      dockerfile: Docker/dockerfile
    container_name: personal-chatbot-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chatbot-net

  redis:
    image: redis:7-alpine
    container_name: personal-chatbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: personal-chatbot-redis-exporter
    restart: unless-stopped
    command:
      - "--redis.addr=redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chatbot-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: personal-chatbot-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - chatbot-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: personal-chatbot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app
      - redis-exporter
      - cadvisor
    networks:
      - chatbot-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: personal-chatbot-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - chatbot-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: personal-chatbot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - chatbot-net

networks:
  chatbot-net:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

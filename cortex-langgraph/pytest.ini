[pytest]
testpaths = tests
# Explicit strict mode: async tests must carry @pytest.mark.asyncio. Without
# this setting pytest-asyncio warns on every run about the unset default.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Deprecation warnings from our own code should fail the build; third-party
# ones are noise we do not control.
filterwarnings =
    error::DeprecationWarning:src.*

markers =
    eval: quality/latency evaluations that call real models and services.
        Deselected by default (see addopts) because they cost money, need
        API keys, and are non-deterministic. Run explicitly with:
        pytest -m eval
    integration: HTTP-level API tests through the real FastAPI app (middleware,
        router, dependencies, controllers) with the business layer mocked.
        Hermetic, so they run by default. Select with: pytest -m integration
    e2e: end-to-end API workflows through the real app AND the real business
        wiring, with only external services faked. Hermetic, so they run by
        default. Select with: pytest -m e2e
    tools: third-party tool integrations under tests/tools/ (Langfuse, RAGAS,
        DeepEval, Grafana). Marked automatically by tests/tools/conftest.py and
        deselected by default: real API calls and optional packages. Run with:
        pytest -m tools

# The default run is hermetic and fast: no network, no API keys, no GPU.
# `eval` and `tools` tests are opt-in via `pytest -m eval` / `pytest -m tools`.
# `-p no:deepeval`: DeepEval (tests/tools/) registers a pytest plugin that imports deepeval
# at startup, and deepeval rejects the empty provider settings in .env, so every run would
# crash. tests/tools/conftest.py imports it safely when a test needs it.
addopts = -m "not eval and not tools" -p no:deepeval

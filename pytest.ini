[pytest]
testpaths = tests
# Explicit strict mode: async tests must carry @pytest.mark.asyncio. Without
# this setting pytest-asyncio warns on every run about the unset default.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Deprecation warnings from our own code should fail the build; third-party
# ones are noise we do not control.
filterwarnings =
    error::DeprecationWarning:src.*
